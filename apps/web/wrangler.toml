# Fruitery Worker: API + static PWA assets + D1.
# Not in this file on purpose: TEAM_DOMAIN, POLICY_AUD and OWNER_EMAIL. They are dashboard variables
# (kept across deploys by keep_vars), so the owner's address never enters the repository.
# Local dev reads them from apps/web/.dev.vars (git-ignored; see .dev.vars.example).
name = "fruitery"
main = "src/worker.js"
compatibility_date = "2026-10-01"
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"
# Only API calls reach the Worker; every other path is a static asset.
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "fruitery"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"
