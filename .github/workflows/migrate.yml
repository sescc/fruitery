name: Migrate D1

# Manual only (decision D32): schema changes are applied deliberately, never on push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run wrangler:config
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          wranglerVersion: "4.149.0"
          command: d1 migrations apply fruitery --remote --config .local/wrangler.toml
