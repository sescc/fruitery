<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <title>Fruitery</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <nav id="rail" aria-label="Workspaces"></nav>
    <div id="list-col">
      <aside id="list" tabindex="0" aria-label="Items"></aside>
      <section id="pin-strip" aria-label="Pinned item" hidden></section>
    </div>
    <div id="list-divider" role="separator" aria-orientation="vertical" aria-label="Resize the item list (double-click to reset)" title="Drag to resize, double-click to reset"></div>
    <main id="panes" aria-label="Panes"></main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
